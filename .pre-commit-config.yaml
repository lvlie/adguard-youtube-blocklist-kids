---
# Install with:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # --unsafe: Home Assistant YAML uses custom tags such as !secret and !include.
        args: [--unsafe]
      - id: check-json
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: validate-blocklist
        name: validate AdGuard blocklist
        description: Every rule must be scoped to the client named in the file header.
        entry: python3 scripts/validate_blocklist.py
        language: system
        # Blocklists only -- requirements-dev.txt is not one.
        files: '^youtube-kids\.txt$'
        pass_filenames: true

      - id: check-ha-package
        name: check Home Assistant package
        description: Parse the package and render its templates before Home Assistant has to.
        entry: python scripts/check_ha_package.py
        # language: python so the hook brings its own pyyaml/jinja2 -- `system`
        # would depend on whatever the machine (or the CI runner) happens to have.
        language: python
        additional_dependencies: ["pyyaml>=6.0.3", "jinja2>=3.1.6"]
        # Only the rest_command package: this checker is specific to it.
        # youtube_kids_native.yaml is covered by tests/test_native_package.py.
        files: '^homeassistant/packages/adguard_youtube_kids\.yaml$'
        pass_filenames: true

      - id: pytest
        name: pytest
        entry: python3 -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
